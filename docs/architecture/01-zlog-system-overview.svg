)"/><text x="835" y="708" class="edge" text-anchor="middle" fill="#3167B1">rules</text><polyline points="1855,555 1855,700 1250,700 1250,720" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="1560" y="682" class="edge" text-anchor="middle" fill="#087F8C">matches</text><polyline points="1340,800 1670,800" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="1505" y="780" class="edge" text-anchor="middle" fill="#087F8C">push</text><polyline points="1950,770 2060,770" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="2165,835 2165,880 1990,880 1990,845" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="2110" y="870" class="edge" text-anchor="middle" fill="#087F8C">context / reply</text><polyline points="1670,790 1510,790 1510,900 988,900 988,930" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="1450" y="882" class="edge" text-anchor="middle" fill="#087F8C">reply</text><polyline points="880,1000 650,1000 650,505 600,505" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="755" y="982" class="edge" text-anchor="middle" fill="#087F8C">poll → IRC</text><polyline points="1855,555 1855,585 2025,585 2025,1007 2040,1007" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="2135" y="925" class="edge" text-anchor="middle" fill="#B86608">recovery coordination</text><text x="1110" y="1135" text-anchor="middle" class="small">Flow details are separated into the four companion diagrams to kee