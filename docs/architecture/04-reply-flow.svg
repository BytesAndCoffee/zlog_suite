<text x="110" y="83" class="eyebrow">04 · REPLY MECHANISM</text>
<text x="110" y="145" class="title">Reply path back to IRC</text>
<text x="110" y="190" class="subtitle">Telegram replies become durable inbound commands before ZNC dispatches them</text>
