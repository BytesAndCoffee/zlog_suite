<rect x="70" y="355" width="220" height="145" rx="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="98" cy="383" r="18" fill="#172033"/><text x="98" y="390" text-anchor="middle" font-size="18" font-weight="800" fill="white">1</text><text x="128" y="402" class="label">Telegram</text><text x="94" y="440" class="body" text-anchor="start"><tspan x="94" dy="0">reply &lt;id&gt; &lt;text&gt;</tspan></text><rect x="360" y="355" width="260" height="145" rx="22" fill="#EAF1FC" stroke="#3167B1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="388" cy="383" r="18" fill="#3167B1"/><text x="388" y="390" text-anchor="middle" font-size="18" font-weight="800" fill="white">2</text><text x="418" y="402" class="label">zlog_bridge.py</text><text x="384" y="440" class="body" text-anchor="start"><tspan x="384" dy="0">parse command</tspan></text><g filter="url(#shadow)"><path d="M700 386 L700 501 C700 515 960 515 960 501 L960 386 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="830.0" cy="386" rx="130.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="728" cy="383" r="18" fill="#6E55A3"/><text x="728" y="390" text-anchor="middle" font-size="18" font-weight="800" fill="white">3</text><text x="758" y="435" class="label">MySQL logs</text><text x="724" y="467" class="body" text-anchor="start"><tspan x="724" dy="0">resolve network</tspan><tspan x="724" dy="24">and destination</tspan></text><rect x="1040" y="355" width="300" height="145" rx="22" fill="#E6F6F7" stroke="#087F8C" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1068" cy="383" r="18" fill="#087F8C"/><text x="1068" y="390" text-anchor="middle" font-size="18" font-weight="800" fill="white">4</text><text x="1098" y="402" class="label" font-size="22">Write transaction</text><text x="1064" y="440" class="body" text-anchor="start"><tspan x="1064" dy="0">insert inbound</tspan><tspan x="1064" dy="28">insert inbound_log</tspan></text><g filter="url(#shadow)"><path d="M1420 386 L1420 501 C1420 515 1690 515 1690 501 L1690 386 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="1555.0" cy="386" rx="135.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="1448" cy="383" r="18" fill="#6E55A3"/><text x="1448" y="390" text-anchor="middle" font-size="18" font-weight="800" fill="white">5</text><text x="1478" y="435" class="label">inbound</text><text x="1444" y="467" class="body" text-anchor="start"><tspan x="1444" dy="0">pending delivery</tspan></text><g filter="url(#shadow)"><path d="M1770 386 L1770 501 C1770 515 2060 515 2060 501 L2060 386 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="1915.0" cy="386" rx="145.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="1798" cy="383" r="18" fill="#6E55A3"/><text x="1798" y="390" text-anchor="middle" font-size="18" font-weight="800" fill="white">6</text><text x="1828" y="435" class="label">inbound_log</text><text x="1794" y="467" class="body" text-anchor="start"><tspan x="1794" dy="0">durable reply audit</tspan></text><polyline points="290,428 360,428" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="620,428 700,428" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><polyline points="960,428 1040,428" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1340,428 1420,428" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1190,500 1190,650 1915,650 1915,515" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="1580" y="632" class="edge" text-anchor="middle" fill="#087F8C">audit copy</text><rect x="1830" y="780" width="300" height="145" rx="22" fill="#E6F6F7" stroke="#087F8C" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1858" cy="808" r="18" fill="#087F8C"/><text x="1858" y="815" text-anchor="middle" font-size="18" font-weight="800" fill="white">7</text><text x="1888" y="827" class="label" font-size="22">zlog-sql poller</text><text x="1854" y="865" class="body" text-anchor="start"><tspan x="1854" dy="0">checks every 5s</tspan><tspan x="1854" dy="28">then deletes inbound row</tspan></text><rect x="1420" y="780" width="280" height="145" rx="22" fill="#E6F6F7" stroke="#087F8C" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1448" cy="808" r="18" fill="#087F8C"/><text x="1448" y="815" text-anchor="middle" font-size="18" font-weight="800" fill="white">8</text><text x="1478" y="827" class="label">reply_queue</text><text x="1444" y="865" class="body" text-anchor="start"><tspan x="1444" dy="0">multiprocessing</tspan><tspan x="1444" dy="28">transit</tspan></text><rect x="1010" y="780" width="300" height="145" rx="22" fill="#E6F6F7" stroke="#087F8C" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1038" cy="808" r="18" fill="#087F8C"/><text x="1038" y="815" text-anchor="middle" font-size="18" font-weight="800" fill="white">9</text><text x="1068" y="827" class="label">DispatchTimer</text><text x="1034" y="865" class="body" text-anchor="start"><tspan x="1034" dy="0">drains queue</tspan><tspan x="1034" dy="28">on ZNC thread</tspan></text><rect x="620" y="780" width="280" height="145" rx="22" fill="#E6F6F7" stroke="#087F8C" stroke-width="2.5" filter="url(#shadow)"/><circle cx="648" cy="808" r="18" fill="#087F8C"/><text x="648" y="815" text-anchor="middle" font-size="18" font-weight="800" fill="white">10</text><text x="678" y="827" class="label">PutIRC</text><text x="644" y="865" class="body" text-anchor="start"><tspan x="644" dy="0">PRIVMSG or ACTION</tspan></text><rect x="220" y="780" width="270" height="145" rx="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="248" cy="808" r="18" fill="#172033"/><text x="248" y="815" text-anchor="middle" font-size="18" font-weight="800" fill="white">11</text><text x="278" y="827" class="label">IRC network</text><text x="244" y="865" class="body" text-anchor="start"><tspan x="244" dy="0">message delivered</tspan><tspan x="244" dy="28">to destination</tspan></text><polyline points="1555,515 1555,700 1980,700 1980,780" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="1790" y="682" class="edge" text-anchor="middle" fill="#087F8C">poll</text><polyline points="1830,853 1700,853" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1420,853 1310,853" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1010,853 900,853" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="620,853 490,853" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><rect x="700" y="1040" width="980" height="85" rx="18" fill="#EAF1FC" stroke="#3167B1" stroke-width="2"/><text x="720" y="1074" font-size="20" font-weight="750" fill="#3167B1">Two stores, two purposes</text><text x="720" y="1104" class="small" text-anchor="start"><tspan x="720" dy="0">inbound is a consumable queue; inbound_log is retained as the reply audit trail.</tspan></text><line x1="110" y1="1252" x2="2290" y2="1252" stroke="#CBD5E1"/><polyline points="130,1290 205,1290" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="225" y="1297" class="small">message or persisted data</text><polyline points="570,1290 645,1290" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><text x="665" y="1297" class="small">query / read</text><polyline points="900,1290 975,1290" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="995" y="1297" class="small">control or state transition</text><rect x="1415" y="1272" width="44" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1475" y="1297" class="small">process</text><path d="M1681 1282 L1681 1302 C1681 1314 1745 1314 1745 1302 L1745 1282 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><ellipse cx="1713" cy="1282" rx="32" ry="12" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><text x="1762" y="1297" class="small">durable store</text><text x="2290" y="1297" class="tiny" text-anchor="end">ZLog architecture · source-derived</text></svg>