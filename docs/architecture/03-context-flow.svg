<text x="110" y="83" class="eyebrow">03 · CONTEXT MECHANISM</text>
<text x="110" y="145" class="title">Context lookup flow</text>
<text x="110" y="190" class="subtitle">A read-only command resolves one event, then returns the preceding ten-minute window</text>
<line x1="110" y1="222" x2="2290" y2="222" stroke="#CBD5E1" stroke-width="2"/>
<rect x="70" y="470" width="220" height="145" rx="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="98" cy="498" r="18" fill="#172033"/><text x="98" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">1</text><text x="128" y="517" class="label">Telegram</text><text x="94" y="555" class="body" text-anchor="start"><tspan x="94" dy="0">context &lt;id&gt;</tspan></text><rect x="360" y="470" width="260" height="145" rx="22" fill="#EAF1FC" stroke="#3167B1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="388" cy="498" r="18" fill="#3167B1"/><text x="388" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">2</text><text x="418" y="517" class="label" font-size="22">zlog_bridge.py</text><text x="384" y="555" class="body" text-anchor="start"><tspan x="384" dy="0">parse command</tspan></text><g filter="url(#shadow)"><path d="M690 501 L690 621 C690 635 950 635 950 621 L950 501 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="820.0" cy="501" rx="130.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="718" cy="498" r="18" fill="#6E55A3"/><text x="718" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">3</text><text x="748" y="550" class="label">MySQL logs</text><text x="714" y="582" class="body" text-anchor="start"><tspan x="714" dy="0">lookup target</tspan><tspan x="714" dy="24">row by id</tspan></text><rect x="1020" y="470" width="310" height="145" rx="22" fill="#EAF6EE" stroke="#2B7A4B" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1048" cy="498" r="18" fill="#2B7A4B"/><text x="1048" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">4</text><text x="1078" y="517" class="label">Time window</text><text x="1044" y="555" class="body" text-anchor="start"><tspan x="1044" dy="0">target.created_at − 10m</tspan><tspan x="1044" dy="28">through target.created_at</tspan></text><g filter="url(#shadow)"><path d="M1400 501 L1400 621 C1400 635 1700 635 1700 621 L1700 501 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="1550.0" cy="501" rx="150.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="1428" cy="498" r="18" fill="#6E55A3"/><text x="1428" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">5</text><text x="1458" y="550" class="label">MySQL logs</text><text x="1424" y="582" class="body" text-anchor="start"><tspan x="1424" dy="0">query same network</tspan><tspan x="1424" dy="24">and channel in window</tspan></text><rect x="1770" y="470" width="260" height="145" rx="22" fill="#EAF1FC" stroke="#3167B1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1798" cy="498" r="18" fill="#3167B1"/><text x="1798" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">6</text><text x="1828" y="517" class="label">Formatter</text><text x="1794" y="555" class="body" text-anchor="start"><tspan x="1794" dy="0">nick + message</tspan><tspan x="1794" dy="28">one line per event</tspan></text><rect x="2100" y="470" width="220" height="145" rx="42" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="2128" cy="498" r="18" fill="#172033"/><text x="2128" y="505" text-anchor="middle" font-size="18" font-weight="800" fill="white">7</text><text x="2158" y="517" class="label">Telegram</text><text x="2124" y="555" class="body" text-anchor="start"><tspan x="2124" dy="0">context block</tspan></text><polyline points="290,543 360,543" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="620,543 690,543" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><polyline points="950,543 1020,543" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1330,543 1400,543" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><polyline points="1700,543 1770,543" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="2030,543 2100,543" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><rect x="430" y="790" width="700" height="112" rx="18" fill="#EAF1FC" stroke="#3167B1" stroke-width="2"/><text x="450" y="824" font-size="20" font-weight="750" fill="#3167B1">Why the target lookup happens first</text><text x="450" y="854" class="small" text-anchor="start"><tspan x="450" dy="0">The reply id identifies the anchor event.</tspan><tspan x="450" dy="25">Its network, channel, and timestamp define the context query.</tspan></text><rect x="1270" y="790" width="700" height="112" rx="18" fill="#EAF1FC" stroke="#3167B1" stroke-width="2"/><text x="1290" y="824" font-size="20" font-weight="750" fill="#3167B1">No transit or state mutation</text><text x="1290" y="854" class="small" text-anchor="start"><tspan x="1290" dy="0">This path reads only the canonical logs table.</tspan><tspan x="1290" dy="25">It does not touch push, inbound, or parser recovery state.</tspan></text><rect x="1030" y="690" width="234" height="36" rx="18" fill="#EAF6EE" stroke="#2B7A4B"/><text x="1147.0" y="715" text-anchor="middle" font-size="16" font-weight="750" fill="#2B7A4B">inclusive time range</text><line x1="110" y1="1252" x2="2290" y2="1252" stroke="#CBD5E1"/><polyline points="130,1290 205,1290" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="225" y="1297" class="small">message or persisted data</text><polyline points="570,1290 645,1290" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><text x="665" y="1297" class="small">query / read</text><polyline points="900,1290 975,1290" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="995" y="1297" class="small">control or state transition</text><rect x="1415" y="1272" width="44" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1475" y="1297" class="small">process</text><path d="M1681 1282 L1681 1302 C1681 1314 1745 1314 1745 1302 L1745 1282 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><ellipse cx="1713" cy="1282" rx="32" ry="12" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><text x="1762" y="1297" class="small">durable store</text><text x="2290" y="1297" class="tiny" text-anchor="end">ZLog architecture · source-derived</text></svg>