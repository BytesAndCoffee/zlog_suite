<text x="110" y="83" class="eyebrow">05 · RECOVERY PATH</text>
<text x="110" y="145" class="title">Database outage and recovery</text>
<text x="110" y="190" class="subtitle">Control signals coordinate a safe cutover; data continues through the local capture buffer</text>
<line x1="110" y1="222" x2="2290" y2="222" stroke="#CBD5E1" stroke-width="2"/>
<rect x="70" y="285" width="2260" height="315" rx="28" fill="#FFF4DC" stroke="#B86608" stroke-width="2"/><text x="110" y="335" class="label" fill="#B86608">CONTROL LANE · dashed, open arrows</text><rect x="70" y="640" width="2260" height="515" rx="28" fill="#E6F6F7" stroke="#087F8C" stroke-width="2"/><text x="110" y="690" class="label" fill="#087F8C">DATA LANE · solid, filled arrows</text><rect x="100" y="390" width="310" height="145" rx="22" fill="#FDEDEE" stroke="#B53C44" stroke-width="2.5" filter="url(#shadow)"/><circle cx="128" cy="418" r="18" fill="#B53C44"/><text x="128" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="white">1</text><text x="158" y="437" class="label">MySQL error</text><text x="124" y="475" class="body" text-anchor="start"><tspan x="124" dy="0">producer, parser,</tspan><tspan x="124" dy="28">or catch-up</tspan></text><rect x="430" y="390" width="330" height="145" rx="22" fill="#FFF4DC" stroke="#B86608" stroke-width="2.5" filter="url(#shadow)"/><circle cx="458" cy="418" r="18" fill="#B86608"/><text x="458" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="white">2</text><text x="488" y="437" class="label" font-size="21">Atomic sleep marker</text><text x="454" y="475" class="body" text-anchor="start"><tspan x="454" dy="0">first worker alerts;</tspan><tspan x="454" dy="28">duplicates no-op</tspan></text><rect x="830" y="390" width="310" height="145" rx="22" fill="#FFF4DC" stroke="#B86608" stroke-width="2.5" filter="url(#shadow)"/><circle cx="858" cy="418" r="18" fill="#B86608"/><text x="858" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="white">3</text><text x="888" y="437" class="label">Workers pause</text><text x="854" y="475" class="body" text-anchor="start"><tspan x="854" dy="0">parser and catch-up</tspan><tspan x="854" dy="28">wait at gate</tspan></text><rect x="1190" y="390" width="330" height="145" rx="22" fill="#FFF4DC" stroke="#B86608" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1218" cy="418" r="18" fill="#B86608"/><text x="1218" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="white">4</text><text x="1248" y="437" class="label">Producer probes</text><text x="1214" y="475" class="body" text-anchor="start"><tspan x="1214" dy="0">default: every 3600s</tspan></text><rect x="1590" y="390" width="340" height="145" rx="22" fill="#FFF4DC" stroke="#B86608" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1618" cy="418" r="18" fill="#B86608"/><text x="1618" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="white">5</text><text x="1648" y="437" class="label">Stable head</text><text x="1614" y="475" class="body" text-anchor="start"><tspan x="1614" dy="0">capture logs max id</tspan><tspan x="1614" dy="28">as recovery cutoff</tspan></text><rect x="2000" y="390" width="270" height="145" rx="22" fill="#EAF6EE" stroke="#2B7A4B" stroke-width="2.5" filter="url(#shadow)"/><circle cx="2028" cy="418" r="18" fill="#2B7A4B"/><text x="2028" y="425" text-anchor="middle" font-size="18" font-weight="800" fill="white">6</text><text x="2058" y="437" class="label">Release</text><text x="2024" y="475" class="body" text-anchor="start"><tspan x="2024" dy="0">queue catch-up job</tspan><tspan x="2024" dy="28">advance live checkpoint</tspan><tspan x="2024" dy="28">remove marker</tspan></text><polyline points="410,463 430,463" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><polyline points="760,463 830,463" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><polyline points="1140,463 1190,463" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><polyline points="1520,463 1590,463" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><polyline points="1930,463 2000,463" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><rect x="100" y="770" width="300" height="145" rx="22" fill="#E6F6F7" stroke="#087F8C" stroke-width="2.5" filter="url(#shadow)"/><circle cx="128" cy="798" r="18" fill="#087F8C"/><text x="128" y="805" text-anchor="middle" font-size="18" font-weight="800" fill="white">1</text><text x="158" y="817" class="label">ZNC capture</text><text x="124" y="855" class="body" text-anchor="start"><tspan x="124" dy="0">IRC events continue</tspan></text><g filter="url(#shadow)"><path d="M480 791 L480 901 C480 915 800 915 800 901 L800 791 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="640.0" cy="791" rx="160.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="508" cy="788" r="18" fill="#6E55A3"/><text x="508" y="795" text-anchor="middle" font-size="18" font-weight="800" fill="white">2</text><text x="538" y="840" class="label">buffer.sqlite</text><text x="504" y="872" class="body" text-anchor="start"><tspan x="504" dy="0">durable local</tspan><tspan x="504" dy="24">outage backlog</tspan></text><g filter="url(#shadow)"><path d="M890 791 L890 901 C890 915 1220 915 1220 901 L1220 791 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="1055.0" cy="791" rx="165.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="918" cy="788" r="18" fill="#6E55A3"/><text x="918" y="795" text-anchor="middle" font-size="18" font-weight="800" fill="white">3</text><text x="948" y="840" class="label">MySQL logs</text><text x="914" y="872" class="body" text-anchor="start"><tspan x="914" dy="0">late rows sync after</tspan><tspan x="914" dy="24">database returns</tspan></text><g filter="url(#shadow)"><path d="M900 986 L900 1096 C900 1110 1200 1110 1200 1096 L1200 986 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="1050.0" cy="986" rx="150.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="928" cy="983" r="18" fill="#6E55A3"/><text x="928" y="990" text-anchor="middle" font-size="18" font-weight="800" fill="white">4</text><text x="958" y="1035" class="label" font-size="22">recovery.sqlite3</text><text x="924" y="1067" class="body" text-anchor="start"><tspan x="924" dy="0">cutoff + catch-up job</tspan></text><rect x="1580" y="770" width="300" height="145" rx="22" fill="#EAF1FC" stroke="#3167B1" stroke-width="2.5" filter="url(#shadow)"/><circle cx="1608" cy="798" r="18" fill="#3167B1"/><text x="1608" y="805" text-anchor="middle" font-size="18" font-weight="800" fill="white">5</text><text x="1638" y="817" class="label">catchup_logs.py</text><text x="1604" y="855" class="body" text-anchor="start"><tspan x="1604" dy="0">read historical logs</tspan><tspan x="1604" dy="28">and users rules</tspan></text><g filter="url(#shadow)"><path d="M2050 761 L2050 871 C2050 885 2270 885 2270 871 L2270 761 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="2160.0" cy="761" rx="110.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="2078" cy="758" r="18" fill="#6E55A3"/><text x="2078" y="765" text-anchor="middle" font-size="18" font-weight="800" fill="white">6</text><text x="2108" y="810" class="label">event_log</text><text x="2074" y="842" class="body" text-anchor="start"><tspan x="2074" dy="0">idempotent</tspan><tspan x="2074" dy="24">match record</tspan></text><g filter="url(#shadow)"><path d="M2050 986 L2050 1096 C2050 1110 2270 1110 2270 1096 L2270 986 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/><ellipse cx="2160.0" cy="986" rx="110.0" ry="31" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2.5"/></g><circle cx="2078" cy="983" r="18" fill="#6E55A3"/><text x="2078" y="990" text-anchor="middle" font-size="18" font-weight="800" fill="white">7</text><text x="2108" y="1035" class="label">push</text><text x="2074" y="1067" class="body" text-anchor="start"><tspan x="2074" dy="0">outbound queue</tspan></text><polyline points="400,843 480,843" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="800,843 890,843" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="845" y="823" class="edge" text-anchor="middle" fill="#087F8C">sync on return</text><polyline points="1220,843 1250,843 1250,720 1540,720 1540,843 1580,843" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><text x="1395" y="700" class="edge" text-anchor="middle" fill="#3167B1">read historical rows</text><polyline points="1200,1033 1555,1033 1555,890 1580,890" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="1390" y="1014" class="edge" text-anchor="middle" fill="#B86608">start job</text><polyline points="1880,820 1960,820 1960,808 2050,808" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1880,865 1960,865 1960,1033 2050,1033" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="2135,535 2135,610 850,610 850,1033 900,1033" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="1760" y="592" class="edge" text-anchor="middle" fill="#B86608">commit cutoff and job</text><rect x="1580" y="970" width="324" height="36" rx="18" fill="#FFF4DC" stroke="#B86608"/><text x="1742.0" y="995" text-anchor="middle" font-size="16" font-weight="750" fill="#B86608">wait until live push is empty</text><text x="1580" y="1060" class="small" text-anchor="start"><tspan x="1580" dy="0">Catch-up reuses the same</tspan><tspan x="1580" dy="25">event_log + push outputs.</tspan></text><line x1="110" y1="1252" x2="2290" y2="1252" stroke="#CBD5E1"/><polyline points="130,1290 205,1290" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="225" y="1297" class="small">message or persisted data</text><polyline points="570,1290 645,1290" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><text x="665" y="1297" class="small">query / read</text><polyline points="900,1290 975,1290" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="995" y="1297" class="small">control or state transition</text><rect x="1415" y="1272" width="44" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1475" y="1297" class="small">process</text><path d="M1681 1282 L1681 1302 C1681 1314 1745 1314 1745 1302 L1745 1282 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><ellipse cx="1713" cy="1282" rx="32" ry="12" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><text x="1762" y="1297" class="small">durable store</text><text x="2290" y="1297" class="tiny" text-anchor="end">ZLog architecture · source-derived</text></svg>