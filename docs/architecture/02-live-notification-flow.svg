oke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1800,845 1720,845" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="1370,642 1540,642 1540,770" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><text x="1455" y="622" class="edge" text-anchor="middle" fill="#3167B1">load rules</text><polyline points="1420,845 1330,845" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="1375" y="825" class="edge" text-anchor="middle" fill="#087F8C">matched events</text><polyline points="990,845 880,845" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><polyline points="600,845 500,845" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><rect x="840" y="1040" width="720" height="112" rx="18" fill="#EAF1FC" stroke="#3167B1" stroke-width="2"/><text x="860" y="1074" font-size="20" font-weight="750" fill="#3167B1">Delivery invariant</text><text x="860" y="1104" class="small" text-anchor="start"><tspan x="860" dy="0">The local SQLite buffer is the first durable write.</tspan><tspan x="860" dy="25">Remote database loss delays delivery; it does not discard capture.</tspan></text><line x1="110" y1="1252" x2="2290" y2="1252" stroke="#CBD5E1"/><polyline points="130,1290 205,1290" fill="none" stroke="#087F8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dataArrow)"/><text x="225" y="1297" class="small">message or persisted data</text><polyline points="570,1290 645,1290" fill="none" stroke="#3167B1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#readArrow)"/><text x="665" y="1297" class="small">query / read</text><polyline points="900,1290 975,1290" fill="none" stroke="#B86608" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="11 9" marker-end="url(#controlArrow)"/><text x="995" y="1297" class="small">control or state transition</text><rect x="1415" y="1272" width="44" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1475" y="1297" class="small">process</text><path d="M1681 1282 L1681 1302 C1681 1314 1745 1314 1745 1302 L1745 1282 Z" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><ellipse cx="1713" cy="1282" rx="32" ry="12" fill="#F1ECFA" stroke="#6E55A3" stroke-width="2"/><text x="1762" y="1297" class="small">durable store</text><text x="2290" y="1297" class="tiny" text-anchor="end">ZLog architecture · source-derived</text></svg>